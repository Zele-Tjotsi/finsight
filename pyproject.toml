[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-platform"
version = "0.1.0"
description = "Financial Data Intelligence Platform for financial analytics and risk intelligence"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "plotly>=5.24",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
